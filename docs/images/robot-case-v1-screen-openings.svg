<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1100" viewBox="-18 -25 115 154" role="img" aria-labelledby="title desc">
  <title id="title">ケースV1：画面左上を原点とした前面開口の配置</title>
  <desc id="desc">表示領域は幅58.50、高さ104.05ミリメートル。左目の左上は5.25,10.03、右目は33.25,10.03、お腹は5.25,41.03、会話穴は17.25,75.03。青は表示用の貫通穴、橙は非貫通の口の溝。画面外の額、ホームボタン、M3穴も同じ座標で配置。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="-18" y="-25" width="115" height="154" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#172033">
    <text x="-15" y="-21" font-size="3.4" font-weight="bold">前面開口・画面左上基準</text>
    <text x="70" y="-21" font-size="2.5">単位：mm</text>

    <!-- Reference phone outline; the case silhouette is deliberately omitted. -->
    <rect x="-4.385" y="-17.19" width="67.27" height="138.44" rx="9.10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.3"/>
    <rect x="0" y="0" width="58.5" height="104.05" fill="#ffffff" stroke="#475569" stroke-width="0.35" stroke-dasharray="1.3 0.8"/>

    <!-- Non-display access openings, also measured from the display origin. -->
    <rect x="12.75" y="-15.97" width="26" height="12" rx="2" fill="#64748b"/>
    <text x="25.75" y="-8.8" text-anchor="middle" font-size="2.8" fill="#fff">F05 額</text>
    <circle cx="29.25" cy="112" r="7" fill="#64748b"/>
    <text x="29.25" y="113" text-anchor="middle" font-size="2.6" fill="#fff">F06</text>

    <!-- Screen-side apertures: these are the UI alignment outlines. -->
    <g fill="#176a96">
      <rect x="5.25" y="10.03" width="20" height="22" rx="8"/>
      <rect x="33.25" y="10.03" width="20" height="22" rx="8"/>
      <rect x="5.25" y="41.03" width="48" height="28" rx="3"/>
      <circle cx="29.25" cy="87.03" r="12"/>
    </g>
    <g text-anchor="middle" fill="#fff" font-size="3.2">
      <text x="15.25" y="22.1">F01</text>
      <text x="43.25" y="22.1">F02</text>
      <text x="29.25" y="56.1">F03</text>
      <text x="29.25" y="88.1">F04</text>
    </g>
    <!-- Entry chamfer: larger than the screen-side touch aperture. -->
    <circle cx="29.25" cy="87.03" r="13" fill="none" stroke="#176a96" stroke-width="0.25" stroke-dasharray="0.8 0.6"/>
    <rect x="17.25" y="35.93" width="24" height="1.2" fill="#b45309"/>

    <!-- Four paired M3 clearance holes, outside the display. -->
    <g fill="#fff" stroke="#475569" stroke-width="0.3">
      <circle cx="-10.75" cy="-9.97" r="1.7"/>
      <circle cx="69.25" cy="-9.97" r="1.7"/>
      <circle cx="-7.75" cy="114.03" r="1.7"/>
      <circle cx="66.25" cy="114.03" r="1.7"/>
    </g>
    <g font-size="2.3" text-anchor="middle" fill="#475569">
      <text x="-10.75" y="-13.3">M01</text>
      <text x="69.25" y="-13.3">M02</text>
      <text x="-9.8" y="120.5">M03</text>
      <text x="67" y="120.5">M04</text>
    </g>

    <!-- Origin and dimensions. -->
    <g stroke="#64748b" stroke-width="0.2" fill="none">
      <path d="M 0 -2.4 H 58.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <path d="M 0 -3.1 V 0 M 58.5 -3.1 V 0"/>
      <path d="M 61.3 0 V 104.05" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <path d="M 58.5 0 H 62 M 58.5 104.05 H 62"/>
      <path d="M 0 0 H 8 M 0 0 V 7" marker-end="url(#arrow)"/>
    </g>
    <circle cx="0" cy="0" r="0.55" fill="#b91c1c"/>
    <text x="1.5" y="3.5" font-size="2.7" fill="#b91c1c">(0, 0)</text>
    <text x="1.5" y="7" font-size="2.2">右が+x、下が+y</text>
    <text x="44" y="-4.3" font-size="2.6">58.50</text>
    <text x="59.4" y="61" transform="rotate(-90 59.4 61)" font-size="2.6">104.05</text>
    <text x="43" y="102.4" font-size="2.1" fill="#64748b">表示領域</text>

    <!-- Leaders and callouts. -->
    <g stroke="#94a3b8" stroke-width="0.22" fill="none">
      <path d="M 53.25 17 H 65"/>
      <path d="M 41.25 36.53 H 65"/>
      <path d="M 53.25 50 H 65"/>
      <path d="M 42.25 87.03 H 65"/>
      <path d="M 36.25 112 H 50"/>
    </g>
    <g font-size="2.6">
      <text x="66" y="16">F01 / F02：目</text>
      <text x="66" y="20">20 × 22、R8</text>
      <text x="66" y="24">top = 10.03</text>
      <text x="66" y="35.7" fill="#b45309">F07：口の溝</text>
      <text x="66" y="39.7" fill="#b45309">画面は見えない</text>
      <text x="66" y="49">F03：お腹</text>
      <text x="66" y="53">48 × 28、R3</text>
      <text x="66" y="57">left = 5.25</text>
      <text x="66" y="61">top = 41.03</text>
      <text x="66" y="82">F04：会話穴</text>
      <text x="66" y="86">画面側：直径24</text>
      <text x="66" y="90">前面側：直径26</text>
      <text x="66" y="94">top = 75.03</text>
      <text x="44" y="110.8">F06：ホーム</text>
      <text x="44" y="115">画面外・保守用</text>
    </g>
    <text x="-14" y="126.3" font-size="2.25" fill="#64748b">青＝表示用貫通穴 ／ 橙＝非貫通溝 ／ 灰＝保守用開口　※ケース外形・厚みは省略</text>
  </g>
</svg>
