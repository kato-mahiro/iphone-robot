<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101827" />
    <title>ぽけっとロボット</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="robot-shell">
      <header class="topbar">
        <span class="status-dot" id="connection-dot"></span>
        <span id="connection-label">準備中</span>
        <span class="topbar-name">POCKET ROBOT</span>
      </header>

      <section class="face-panel" aria-label="ロボットの表情">
        <div class="face-glow"></div>
        <div class="eyes" aria-hidden="true">
          <span class="eye eye-left"></span>
          <span class="eye eye-right"></span>
        </div>
        <div class="mouth" id="mouth" aria-hidden="true"></div>
        <span class="face-spark spark-one">✦</span>
        <span class="face-spark spark-two">·</span>
      </section>

      <section class="conversation" aria-live="polite">
        <p class="state-label" id="state-label">話しかけてね</p>
        <p class="transcript" id="transcript">ボタンを押している間、話してみて。</p>
      </section>

      <button class="talk-button" id="talk-button" type="button">
        <span class="talk-button-ring"></span>
        <span class="talk-button-icon" aria-hidden="true">●</span>
        <span class="talk-button-text">押して話す</span>
      </button>

      <p class="hint" id="hint">最初にマイクの使用を許可してください</p>

      <details class="connection-settings">
        <summary>接続設定</summary>
        <label for="ws-url">Hayamimi WebSocket</label>
        <input id="ws-url" type="url" spellcheck="false" autocomplete="off" />
        <button id="save-settings" class="save-button" type="button">保存</button>
      </details>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
