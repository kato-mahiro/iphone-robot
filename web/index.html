<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#030709" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ぽけっとロボット" />
    <title>ぽけっとロボット</title>
    <link rel="stylesheet" href="styles.css?v=20260920-8" />
  </head>
  <body>
    <main class="robot-shell">
      <section class="face-panel" aria-label="ロボットの表情">
        <span class="eye eye-left" aria-hidden="true"></span>
        <span class="eye eye-right" aria-hidden="true"></span>
      </section>

      <section class="belly" aria-live="polite">
        <div class="belly-main" id="belly-main">
          <div class="status-line">
            <span class="status-dot" id="connection-dot"></span>
            <span id="connection-label">準備中</span>
          </div>
          <p class="state-label" id="state-label">話しかけてね</p>
          <p class="transcript" id="transcript">下のボタンを押している間に話してね</p>
          <p class="hint" id="hint">最初にマイクの使用を許可してください</p>
        </div>

        <section class="diagnostics" id="diagnostics" aria-label="診断ログ" hidden>
          <pre id="debug-log"></pre>
        </section>

        <nav class="belly-tabs" aria-label="表示切り替え">
          <button class="belly-tab selected" type="button" data-view="main">会話</button>
          <button class="belly-tab" type="button" data-view="log">ログ</button>
        </nav>
      </section>

      <button class="talk-button" id="talk-button" type="button" aria-label="押している間、話す">
        <span class="talk-button-icon" aria-hidden="true"></span>
        <span class="talk-button-text">押して<br />話す</span>
      </button>
    </main>
    <script src="app.js?v=20260920-8" defer></script>
  </body>
</html>
